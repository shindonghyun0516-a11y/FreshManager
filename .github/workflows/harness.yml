name: Python Harness

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    name: Harness and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run harness
        run: python3 scripts/harness_check.py

      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -p "test_*.py" -v
