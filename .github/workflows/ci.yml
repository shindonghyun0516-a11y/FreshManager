name: CI Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  project_guard:
    name: Project Guard and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Project Guard
        env:
          PROJECT_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROJECT_GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/project_guard_check.py

      - name: Install machine learning requirements
        run: python -m pip install -r requirements-ml.txt

      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -p "test_*.py" -v
