name: ML Runtime Validation

on:
  pull_request:
    paths:
      - requirements-ml.txt
      - .github/workflows/ml-runtime.yml
      - freshmanager/eg8c_modeling.py
      - tests/test_eg8c_modeling.py
      - scripts/ml/**
  push:
    branches:
      - main
    paths:
      - requirements-ml.txt
      - .github/workflows/ml-runtime.yml
      - freshmanager/eg8c_modeling.py
      - tests/test_eg8c_modeling.py
      - scripts/ml/**

permissions:
  contents: read

jobs:
  runtime_smoke:
    name: Python and scikit-learn Smoke Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ML dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ml.txt

      - name: Verify runtime
        run: >-
          python -c 'import sys, sklearn;
          assert sys.version_info[:2] == (3, 12);
          assert sklearn.__version__ == "1.6.1";
          print(sys.version.split()[0], sklearn.__version__)'
