name: Web Platform Validation

on:
  pull_request:
    paths:
      - .github/workflows/web-platform.yml
      - .python-version
      - pyproject.toml
      - requirements.txt
      - requirements-api-test.txt
      - apps/__init__.py
      - apps/api/**
      - apps/web/**
      - freshmanager/pilot_spot_options.py
      - freshmanager/selected_area_pilot.py
      - data/prototype/**
      - scripts/export_web_openapi.py
      - scripts/generate_web_api_types.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/web-platform.yml
      - .python-version
      - pyproject.toml
      - requirements.txt
      - requirements-api-test.txt
      - apps/__init__.py
      - apps/api/**
      - apps/web/**
      - freshmanager/pilot_spot_options.py
      - freshmanager/selected_area_pilot.py
      - data/prototype/**
      - scripts/export_web_openapi.py
      - scripts/generate_web_api_types.py

permissions:
  contents: read

jobs:
  api:
    name: FastAPI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install API test requirements
        run: python -m pip install --disable-pip-version-check -r requirements-api-test.txt

      - name: Check API dependency consistency
        run: python -m pip check

      - name: Verify API app and health endpoint
        run: >-
          python -c 'from fastapi.testclient import TestClient;
          from apps.api.main import app;
          response = TestClient(app).get("/api/v1/health");
          assert response.status_code == 200;
          assert response.json() == {"status": "ok", "service": "freshmanager-api"}'

      - name: Verify OpenAPI and runtime error contract
        run: python -B -m unittest apps.api.tests.test_area_pilot -v

      - name: Verify OpenAPI type generator
        run: python -B -m unittest apps.api.tests.test_web_api_type_generation -v

      - name: Verify generated web API types
        run: >-
          python -B scripts/generate_web_api_types.py
          --output apps/web/src/generated/api-types.ts --check

      - name: Run API tests
        run: python -B -m unittest discover -s apps/api/tests -p "test_*.py" -v

  web:
    name: Vue Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Verify browser-only location and interaction contract
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const app = readFileSync("src/App.vue", "utf8");
          const map = readFileSync("src/naver-map.ts", "utf8");
          const styles = readFileSync("src/styles.css", "utf8");
          const generated = readFileSync("src/generated/api-types.ts", "utf8");
          const between = (source, start, end) => source.split(start)[1].split(end)[0];

          assert.match(app, /from "\.\/generated\/api-types";/);
          assert.doesNotMatch(
            app,
            /^type (?:PopulationRange|AreaSummary|AreaView|SpotOption|PilotView)\s*=\s*\{/m,
          );
          assert.equal(generated.match(/^export type /gm)?.length, 9);
          assert.doesNotMatch(generated, /\b(?:any|unknown)\b/);

          assert.equal(app.match(/straightLineDistanceKm\(/g)?.length, 2);
          assert.match(app, /straightLineDistanceKm\(point, spot\)/);
          assert.doesNotMatch(app, /selectedSpotDistances|다른 후보 위치까지 직선거리/);
          assert.doesNotMatch(app, /localStorage|sessionStorage|document\.cookie/);
          assert.equal(app.match(/navigator\.geolocation\.getCurrentPosition/g)?.length, 1);

          const location = between(app, "function requestLocation()", "function handleEscape()");
          const beforeRequest = location.split("navigator.geolocation.getCurrentPosition")[0];
          assert.match(beforeRequest, /userLocation\.value = null/);
          assert.match(beforeRequest, /mapController\?\.setUserLocation\(null\)/);

          for (const body of [
            between(app, "async function loadAreas()", "async function selectArea()"),
            between(app, "async function selectArea()", "function destroyMap()"),
          ]) {
            const call = between(body, "const response = await fetch(", "if (!response.ok)");
            assert.doesNotMatch(call, /userLocation|latitude|longitude|body:|URLSearchParams/);
          }

          assert.match(map, /setUserLocation\(point: MapPoint \| null\)/);
          assert.match(app, /const focusTrigger = panel\.value === "none" \? trigger : undefined/);
          assert.match(styles, /\.selection-toast \{[\s\S]*?pointer-events: none;/);
          NODE

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Verify build output is untracked
        run: |
          test -z "$(git ls-files -- dist)"
          git check-ignore --quiet dist/index.html
